<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>A Game Empire Tycoon Game</title>
  <style>
    html, body { margin: 0; padding: 0; overflow: hidden; background: #0b0e16; height: 100%; }
    #game-canvas { display: block; width: 100vw; height: 100vh; }
    #game-overlay {
      position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
      flex-direction: column; gap: 18px; background: rgba(11,14,22,0.88);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; color: #e8ecf5;
    }
    #game-overlay-text { font-size: 28px; font-weight: 700; letter-spacing: 0.02em; text-align: center; padding: 0 24px; }
    #game-overlay-btn {
      font-family: inherit; font-size: 16px; font-weight: 600; padding: 12px 28px;
      background: #6fd3ff; color: #0b0e16; border: none; cursor: pointer; letter-spacing: 0.04em;
    }
    #game-overlay-btn:hover { background: #9fe6b3; }
  </style>
</head>
<body>
  <canvas id="game-canvas"></canvas>
  <div id="game-overlay">
    <div id="game-overlay-text"></div>
    <button id="game-overlay-btn"></button>
  </div>
  <script type="module" src="./player-entry.js"></script>
</body>
</html>
